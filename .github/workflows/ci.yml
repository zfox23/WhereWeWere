name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS is required: migration 028 tracks runs `CREATE EXTENSION IF NOT EXISTS postgis`
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wherewewere
          POSTGRES_PASSWORD: wherewewere
          POSTGRES_DB: wherewewere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wherewewere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must satisfy jsdom@30's engines (^22.22.2 || ^24.15.0 || >=26.0.0) and
          # its undici@8 dependency (>=22.19.0); Node 20 cannot load them.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Backend integration tests
        run: npm run test:integration
