# Keep the scheme an outer TLS-terminating proxy reported, so the server sees
# HTTPS (and marks the session cookie Secure) behind it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 900s;
    }

    # Backups carry the original audio of notes, so restoring one can upload many GB.
    # Stream the upload straight through instead of staging it in nginx's temp dir.
    location /api/v1/backup/ {
        client_max_body_size 20G;
        proxy_request_buffering off;
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Scrobbler protocol for multi-scrobbler (authenticated by its own key).
    location /apis/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # The service worker script, app shell, and manifest must never be
    # stale-cached: browsers detect new deployments by revalidating these.
    location = /sw-custom.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Hashed build output: cache forever, and 404 (not the app shell) for
    # files an older build referenced, so old pages fail cleanly and reload.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
