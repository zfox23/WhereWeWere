<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhereWeWere</title>
    <script>
      // Restore the last applied theme before first paint (the React
      // ThemeProvider only runs after the bundle loads, which flashed a light
      // page for dark-theme users). Best effort: any failure is ignored.
      (function () {
        try {
          var root = document.documentElement;
          var raw = window.localStorage.getItem('theme-snapshot');
          var snap = raw ? JSON.parse(raw) : null;
          if (snap) {
            if (snap.dark) root.classList.add('dark');
            if (snap.style) root.setAttribute('style', snap.style);
            if (snap.theme) root.dataset.theme = snap.theme;
            // Appearance knobs as data-* attributes (see applyAppearanceToRoot).
            var attrs = snap.attrs || { bgPattern: snap.bgPattern, bgGradient: snap.bgGradient };
            for (var key in attrs) {
              if (Object.prototype.hasOwnProperty.call(attrs, key) && typeof attrs[key] === 'string' && attrs[key]) {
                root.dataset[key] = attrs[key];
              }
            }
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="A self-hosted check-in tracker for the places that matter to you." />
    <meta name="theme-color" content="#ea580c" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
