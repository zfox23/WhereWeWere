services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: wherewewere
      POSTGRES_PASSWORD: wherewewere
      POSTGRES_DB: wherewewere
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      #- postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wherewewere -d wherewewere"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wherewewere:wherewewere@db:5432/wherewewere
      NODE_ENV: ${NODE_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PHOTON_URL: ${PHOTON_URL:-}
      COASTERPEDIA_CONTACT: ${COASTERPEDIA_CONTACT:-}
      DATA_DIR: /app/data
    ports:
      - "${SERVER_PORT:-3001}:3001"
    volumes:
      - ./data/server:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional local speech-to-text (faster-whisper behind an OpenAI-compatible
  # API). Not started by default; enable with:
  #   docker compose --profile transcription up -d
  # On start it installs the model named by TRANSCRIPTION_MODEL (a few GB the
  # first time, cached in the whisper_models volume; set it empty to install nothing).
  # Then in the app: Settings -> Integrations -> Notes -> Audio transcription,
  # base URL http://transcription:8000/v1 (from the server container) or
  # http://localhost:${TRANSCRIPTION_PORT:-8000}/v1, and the same model name.
  # Requires an NVIDIA GPU and the NVIDIA Container Toolkit.
  transcription:
    profiles: ["transcription"]
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    command: ["sh", "/start.sh"]
    environment:
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL-Systran/faster-whisper-large-v3}
      # Off by default. Batched mode stops a transcript looping on one phrase, but it only works with
      # voice-activity detection, which discards quiet speech (children, singing, distant voices), and
      # it returns one segment per 30 s chunk instead of sentences. See docs/audio-notes.md.
      WHISPER__USE_BATCHED_MODE: ${TRANSCRIPTION_BATCHED_MODE-false}
    ports:
      - "${TRANSCRIPTION_PORT:-8000}:8000"
    volumes:
      - ./transcription/start.sh:/start.sh:ro
      # A named volume, not ./data/whisper: Docker would create a missing host directory
      # owned by root, and the container (user ubuntu) could not write the model into it.
      - whisper_models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional speaker diarization ("who spoke when") for audio notes, using pyannote 3.1. Not started
  # by default; enable with:
  #   docker compose --profile diarization up -d --build diarization
  # The model is gated on Hugging Face: put a read token in .env as HF_TOKEN and accept the terms of
  # pyannote/speaker-diarization-3.1 and pyannote/segmentation-3.0 once (see docs/audio-notes.md).
  # Then in the app: Settings -> Integrations -> Notes -> Speaker identification, URL
  # http://diarization:8001 (from the server container). Uses the NVIDIA GPU.
  diarization:
    profiles: ["diarization"]
    build:
      context: ./diarization
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${DIARIZATION_PORT:-8001}:8001"
    volumes:
      # A named volume (not a ./data bind mount) so the non-bind directory is writable; models download once.
      - diarization_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  whisper_models:
  diarization_models:
